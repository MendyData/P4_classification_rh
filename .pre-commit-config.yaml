repos:
  # Outils Python executes par uv dans le .venv du projet : memes versions que
  # uv.lock et reglages lus dans pyproject.toml ([tool.black], [tool.isort]).
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types_or: [python, jupyter]

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]

      # flake8 ne lit pas pyproject.toml : longueur de ligne alignee ici sur [tool.black]
      - id: flake8
        name: flake8
        entry: uv run flake8 --max-line-length 100 --extend-ignore E203
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
